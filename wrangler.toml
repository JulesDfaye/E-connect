name = "e-connect"
main = "api/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "e-connect-db"
# Remplacer après : npx wrangler d1 create e-connect-db
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
